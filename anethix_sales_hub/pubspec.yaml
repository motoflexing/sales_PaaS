name: anethix_sales_hub
description: "Anethix Sales Hub - internal sales team management tool."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  file_picker: ^12.2.0
  csv: ^6.0.0
  excel: ^4.0.6
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_lint: ^2.6.3
  flutter_launcher_icons: ^0.14.2

dependency_overrides:
  path_provider_foundation: 2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/app_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_logo.png"