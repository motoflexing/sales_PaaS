<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sales team management for Anethix Labs">

  <!-- viewport-fit=cover lets the app paint under the iPhone notch and home
       indicator; user-scalable=no stops the double-tap zoom that otherwise
       fights with the app's own gestures. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A237E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anethix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anethix Sales Hub</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { overscroll-behavior: none; }

    /* The shell shows through until Flutter paints, so it is painted in the
       app's own colours rather than the browser's default white. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000000;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background-color: #000000;
      /* Sits above the canvas until the first frame lands. */
      z-index: 10;
      transition: opacity 250ms ease-out;
    }

    #loading.done {
      opacity: 0;
      pointer-events: none;
    }

    #loading .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(26, 35, 126, 0.25);
      border-top-color: #5C6BC0;
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    #loading .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="label">Anethix Sales Hub</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Flutter fires this once it has painted; fade the shell out then drop it
    // so it can never sit on top of the running app.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.classList.add('done');
      setTimeout(function () { loading.remove(); }, 300);
    });
  </script>
</body>
</html>
